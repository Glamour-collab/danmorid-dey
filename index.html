    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #07090f 0%, #121824 100%);
            color: #ffffff;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100svh;
            justify-content: space-between;
            padding-bottom: 95px;
            overflow-x: hidden;
        }

        .main-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 20px 20px;
            flex: 1;
        }

        .store-brand-badge {
            width: 90px;
            height: 90px;
            background: linear-gradient(145deg, #182030, #0a0e17);
            border: 2px solid rgba(212, 175, 55, 0.4);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.7),
                inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }

        .store-brand-badge svg {
            width: 42px;
            height: 42px;
            stroke: #d4af37;
        }

        h1 {
            color: #ffffff;
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 4px;
            letter-spacing: 1.5px;
        }

        .store-tagline {
            color: #d4af37;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3.5px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* زر واتساب الدائري */
        .pulsing-whatsapp-circle {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, #25d366, #1ebe5d);
            border-radius: 50%;
            margin: 0 auto 22px;
            box-shadow: 0 12px 30px rgba(37, 211, 102, 0.4);
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .pulsing-whatsapp-circle::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #25d366;
            animation: ringPulse 2s infinite;
            pointer-events: none;
        }

        @keyframes ringPulse {
            0% {
                transform: scale(1);
                opacity: 0.9;
            }
            100% {
                transform: scale(1.35);
                opacity: 0;
            }
        }

        .pulsing-whatsapp-circle:active {
            transform: scale(0.94);
        }

        .pulsing-whatsapp-circle svg {
            width: 62px;
            height: 62px;
            fill: #ffffff;
        }

        .call-to-action-title {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .call-to-action-subtitle {
            font-size: 13px;
            color: #a0aec0;
            font-weight: 500;
            margin-bottom: 25px;
        }

        .store-description {
            font-size: 14px;
            color: #8892b0;
            line-height: 1.8;
            max-width: 340px;
            margin: 0 auto;
            font-weight: 400;
        }

        /* الشريط السفلي */
        .fixed-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 15, 25, 0.98);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(37, 211, 102, 0.25);
            padding: 12px 16px;
            z-index: 1000;
            box-shadow: 0 -6px 25px rgba(0, 0, 0, 0.9);
        }

        .bottom-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            background: linear-gradient(135deg, #25d366 0%, #1db954 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            font-size: 16px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.35);
            transition: all 0.2s ease;
        }

        .bottom-action-btn:active {
            transform: scale(0.98);
        }

        .bottom-action-btn svg {
            width: 25px;
            height: 25px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        /* تحسين الشاشات الصغيرة */
        @media (max-height: 650px) {
            .main-content-wrapper {
                padding-top: 18px;
            }

            .store-brand-badge {
                width: 70px;
                height: 70px;
                margin-bottom: 12px;
            }

            .store-tagline {
                margin-bottom: 18px;
            }

            .pulsing-whatsapp-circle {
                width: 100px;
                height: 100px;
                margin-bottom: 15px;
            }

            .call-to-action-subtitle {
                margin-bottom: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .pulsing-whatsapp-circle::before {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="main-content-wrapper">

                 stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
        </div>

        <h1>LUNÉRA</h1>

        <!-- الزر الأوسط (واتساب) -->
        <a href="#"
           class="pulsing-whatsapp-circle whatsapp-link"

            <svg viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.124-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>

    <!-- الزر السفلي (الشريط الثابت) -->

            <span>راسلنا عبر الواتساب</span>

        </a>

    </div>

    <!-- إعداد روابط واتساب وتتبع النقرات (إرسال الإشارة مرة واحدة فقط عند أول نقر وتحويل العميل طبيعياً) -->
    <script>
    (function(){

        const whatsappNumber = '972567938099';
        const whatsappMessage = 'مرحباً، لقد صادفت اعلانك على TikTok وأود معرفة المزيد؟';
        const whatsappURL = 'https://wa.me/' + whatsappNumber + '?text=' + encodeURIComponent(whatsappMessage);

        // متغير لتتبع ما إذا تم إرسال إشارة البكسل في هذه الجلسة أم لا
        let hasTracked = false;

        document.querySelectorAll('.whatsapp-link').forEach(function(link){

            link.href = whatsappURL;

            link.addEventListener('click', function(event){

                // السماح بالفتح في تبويبات جديدة أو بالنقر المزدوج الخاص بشكل طبيعي
                if (
                    event.button !== 0 ||
                    event.ctrlKey ||
                    event.metaKey ||
                    event.shiftKey ||
                    event.altKey
                ) {
                    return;
                }

                // إرسال الإشارة (البكسل) أول مرة فقط
                if (!hasTracked) {
                    hasTracked = true;
                    try {
                        if (typeof window.ttq !== 'undefined' && typeof window.ttq.track === 'function') {
                            window.ttq.track('Contact');
                        }
                    } catch(error) {
                        // تجاهل أي خطأ تقني في البكسل لكي لا يؤثر على العميل
                    }
                }

                // ملاحظة: لا نستخدم event.preventDefault()، 
                // لكي يتم تحويل العميل إلى تطبيق واتساب فوراً وبكل سهولة عند كل نقرة.

            });

        });

    })();
    </script>
